name: home-fulfillment
services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run ./start.sh first}
      MYSQL_DATABASE: home_fulfillment
      MYSQL_USER: hf_migrator
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run ./start.sh first}
      HF_DB_APP_PASSWORD: ${HF_DB_APP_PASSWORD:?run ./start.sh first}
    ports:
      - "127.0.0.1:${HF_MYSQL_PORT:-43307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 10s
  redis:
    image: redis:7.4.9-alpine
    profiles: ["m4"]
    ports:
      - "127.0.0.1:${HF_REDIS_PORT:-46379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
  mq-nameserver:
    image: apache/rocketmq:5.3.0
    platform: linux/amd64
    profiles: ["m4"]
    command: ["nameserver"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn64m"
    ports:
      - "127.0.0.1:${HF_MQ_NAMESERVER_PORT:-49876}:9876"
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "true >/dev/tcp/127.0.0.1/9876"]
      interval: 3s
      timeout: 2s
      retries: 20
  mq-broker:
    image: apache/rocketmq:5.3.0
    platform: linux/amd64
    profiles: ["m4"]
    user: "0:0"
    depends_on:
      mq-nameserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        printf '%s\n' 'brokerIP1=127.0.0.1' "listenPort=$$HF_MQ_BROKER_PORT" \
          'namesrvAddr=mq-nameserver:9876' 'brokerClusterName=HomeFulfillment' 'brokerName=hf-broker' \
          'brokerId=0' 'brokerRole=ASYNC_MASTER' 'flushDiskType=SYNC_FLUSH' \
          'autoCreateTopicEnable=true' 'storePathRootDir=/home/rocketmq/store' 'mappedFileSizeCommitLog=16777216' \
          'maxMessageSize=262144' > /tmp/hf-broker.properties
        chown 3000:3000 /home/rocketmq/store
        export HOME=/home/rocketmq
        exec su -m -s /bin/bash rocketmq -c 'export PATH=/opt/java/openjdk/bin:$$PATH; exec ./mqbroker -c /tmp/hf-broker.properties'
    environment:
      HF_MQ_BROKER_PORT: ${HF_MQ_BROKER_PORT:-41911}
      JAVA_OPT_EXT: "-Xms128m -Xmx384m -Xmn96m -XX:MaxDirectMemorySize=256m"
    ports:
      - "127.0.0.1:${HF_MQ_BROKER_PORT:-41911}:${HF_MQ_BROKER_PORT:-41911}"
    volumes:
      - rocketmq-data:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'true >/dev/tcp/127.0.0.1/$$HF_MQ_BROKER_PORT'"]
      interval: 3s
      timeout: 2s
      retries: 25
volumes:
  mysql-data:
  rocketmq-data:
